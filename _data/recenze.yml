- name: "Lucie Hlaváčková"
  role: "HR konzultantka, Pepperl+Fuchs Manufacturing s.r.o."
  type: "Video na sociální sítě"
  rating: 5
  appreciated: "Improvizace, kreativita a dobrá komunikace."
  summary: >-
    Spolupráci mohu jednoznačně doporučit. Od prvního zadání zakázky až po
    finální úpravy videí byla komunikace naprosto bezproblémová, profesionální
    a zároveň velmi příjemná. Oceňuji především kreativní přístup, ochotu
    naslouchat našim představám a schopnost proměnit je ve skvělý výsledek.
    Po celou dobu byla spolupráce vstřícná a flexibilní a všechny naše
    požadavky byly pečlivě zohledněny. Finální videa splnila naše očekávání
    po obsahové i vizuální stránce. Pokud hledáte spolehlivého tvůrce videí
    s profesionálním přístupem, kreativitou a smyslem pro detail, mohu tuto
    spolupráci s čistým svědomím doporučit.

