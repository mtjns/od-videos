# ---------------------------------------------------------------------------
# CENY pro stránku /cenik
#
# Stránka stojí na SLUŽBÁCH. Každá položka, kterou si klient může objednat,
# má svoje id a cenu tady — kalkulačka i balíčky (dlaždice) sčítají pořád
# ty samé služby, takže nikde nemůže vzniknout rozdílná cena.
#
#   • částky v Kč, celá čísla bez mezer:  4500   (ne "4 500 Kč")
#   • procenta jako celé číslo:           20     (= +20 %)
#   • texty (nadpisy, popisky, odrážky) se píšou v pages/cenik.html
#
# Věty, které cenu zmiňují ("2 ks = 3 750 Kč/ks"), si stránka skládá sama
# z čísel níže — nikde je nepřepisujte ručně.
# ---------------------------------------------------------------------------


# === SLUŽBY s pevnou cenou =================================================
sluzby:

  # --- Videoprohlídka nemovitosti (vybírá se právě jedna dispozice) --------
  videoprohlidka_byt_1kk: 5500
  videoprohlidka_byt_2kk: 6500
  videoprohlidka_byt_3kk: 7250
  videoprohlidka_byt_4kk: 8000
  videoprohlidka_rodinny_dum: 8000   # zobrazuje se jako "od"

  # --- Přídavky k videoprohlídce ------------------------------------------
  reel_ze_zaberu: 1500
  reel_nove_zabery: 2500             # zobrazuje se jako "od"
  ai_zabery_reality: 500             # zobrazuje se jako "od"

  # --- Svatba ---------------------------------------------------------------
  svatebni_video: 15000

  # --- Přídavky účtované za každé video -------------------------------------
  licencovana_hudba: 250             # za jedno video (reely i studiová videa)
  licencovana_hudba_projekt: 500     # jedna licence pro celý projekt (od 2 videí)
  ai_zabery_studio: 500              # za každé studiové video
  ai_zabery_reel: 500               # za každý reel

# === SLUŽBY účtované za KAŽDÉ video ========================================
#
# U těchto služeb se počet vždy rovná počtu videí v zakázce. Kalkulačka
# i dlaždice balíčků si ho dopočítají samy, takže v balíčku stačí napsat
# libovolný počet (třeba 1) — přepočítá se na skutečný počet videí.
sluzby_za_video:
  - licencovana_hudba
  - ai_zabery_studio
  - ai_zabery_reel


# === SLUŽBY s cenou podle počtu kusů =======================================
#
# Klíč = od kolika kusů cena platí, hodnota = cena ZA JEDEN kus.
#   3: 2500   →   při 3 a více kusech stojí každý kus 2 500 Kč
#
# Pásem může být kolik chcete — stačí přidat další řádek (třeba 10: 2200)
# a kalkulačka i věta "1 ks = … · 2 ks = …" se o něj samy rozšíří.
sluzby_podle_poctu:

  reel_zakladni:
    1: 2000
    2: 1800
    3: 1500

  reel_pokrocily:
    1: 3000
    2: 2750
    3: 2500

  studiove_video:
    1: 4000
    2: 3750
    3: 3500


# === BALÍČKY = dlaždice nad kalkulačkou ====================================
#
# Balíček není nic jiného než předvyplněný formulář: seznam služeb a jejich
# počtů. Cena na dlaždici se z nich sečte a kliknutí je vloží do kalkulačky,
# takže dlaždice a kalkulačka nemohou ukázat rozdílnou částku.
#
# Kategorie (videoprohlídka / reel / studio / svatba) se pozná sama podle
# první služby v seznamu — nikam se nepíše.
# Odrážky "co balíček obsahuje" jsou psané v pages/cenik.html.
balicky:

  sada_3_reels:
    reel_pokrocily: 3

  videoprohlidka_reel:
    videoprohlidka_byt_1kk: 1
    reel_ze_zaberu: 1

  sada_3_studiova_videa:
    studiove_video: 3

  # Zvýrazněná dlaždice "Populární volba"
  top_videoprohlidka_reel:
    videoprohlidka_byt_2kk: 1
    reel_nove_zabery: 1
    ai_zabery_reality: 1


# === Doprava ===============================================================
doprava:
  za_km: 10
  trutnov: 200               # fixní cena za cestu
  liberec: 150               # fixní cena za cestu


# === Procentní příplatky ===================================================
priplatky:
  velke_mesto: 10            # Praha / Brno — % z ceny včetně dopravy
  expresni_dodani: 20        # % ze základu + přídavků + dopravy + velkého města


# === Slevové kódy ==========================================================
#
#   typ: procenta  → hodnota je sleva v %      (10   = −10 %)
#   typ: castka    → hodnota je sleva v Kč     (1000 = −1 000 Kč)
#
# POZOR: kódy se na stránce nikde nezobrazují, ale jsou součástí veřejného
# zdrojového kódu webu — kdokoli si je v něm může najít.
slevove_kody:
  - kod: "ODfriend"
    typ: procenta
    hodnota: 10
  - kod: "ODstart"
    typ: procenta
    hodnota: 50
  - kod: "ODhavic"
    typ: castka
    hodnota: 1000
