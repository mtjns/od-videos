# Projekty OD Videos
# Umístění v repozitáři: _data/projekty.yml  (Jekyll data soubor)
# Určeno pro konkrétní projekty (zakázky) v galerii – na rozdíl od
# _data/galerie.yml, kde jsou videa řazená jen do širokých kategorií.
#
# Každá položka = jeden projekt:
#   nadpis     – název projektu (např. „Byt 2+kk, Vinohrady“)
#   podnadpis  – krátký doplněk pod nadpisem (klient, lokalita, rok…)
#   popis      – volitelný odstavec o zakázce (co se natáčelo a proč)
#   vimeo      – seznam ID videí z Vimea; vykreslí se v tomto pořadí
#
#
# Kde ID vzít: v odkazu na video za posledním lomítkem.
#   https://vimeo.com/912345678            → 912345678
# U neveřejného (unlisted) videa je v odkazu ještě privátní hash – zapiš ho
# včetně lomítka:
#   https://vimeo.com/912345678/a1b2c3d4e5 → 912345678/a1b2c3d4e5
#
# ID piš v uvozovkách, ať se nevykládá jako číslo.
# Projekt bez videí se zobrazí jako „Připravujeme“.
# Pořadí projektů zde = pořadí na stránce.
#
# Vzor jedné položky (zkopíruj, odkomentuj a vyplň):
#
# - nadpis: "Byt 2+kk, Vinohrady"
#   podnadpis: "RE/MAX Alfa · Praha 2 · 2025"
#   popis: "Videoprohlídka bytu doplněná o reel na sociální sítě."
#   vimeo:
#     - "912345678"
#     - "912345679/a1b2c3d4e5"
#

- nadpis:
  podnadpis:
  popis:
  vimeo:
    -
