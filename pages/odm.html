/* Layout: jeden sloupec max 1120 px — jméno, velké okno s videem, pruh s galerií, shrnutí ve dvou sloupcích, odkazy a kontakt, tmavá patička. Design systém OD Videos. */
:root{
  --bg:#ffffff; --surface:#f4f4f5; --deep:#141414;
  --fg:#1a1a1a; --muted:#616161; --line:rgba(0,0,0,.09);
  --brand:#e2a92c; --brand-ink:#ba7c12; --on-brand:#1a1a1a;

  --on-deep:#ffffff; --on-deep-muted:#a6a6a6;

  --logo-c:block; --logo-w:none;

  --script:"Story Script", "Segoe Script", "Brush Script MT", cursive;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0a0a; --surface:#151515; --deep:#000000;
    --fg:#ffffff; --muted:#a6a6a6; --line:rgba(255,255,255,.13);
    --brand-ink:#e2a92c; --glow:rgba(226,169,44,.30);
    --stage:#1c1c1c; --logo-c:none; --logo-w:block; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#151515; --deep:#000000;
  --fg:#ffffff; --muted:#a6a6a6; --line:rgba(255,255,255,.13);
  --brand-ink:#e2a92c; --glow:rgba(226,169,44,.30);
  --stage:#1c1c1c; --logo-c:none; --logo-w:block; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
body.dev-mobile{background:var(--stage)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}

/* ---------- stránka ---------- */
.page{container:page / inline-size;background:var(--bg);min-height:100%}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.logo{display:flex;align-items:center;height:44px}
.logo img{height:44px;width:auto;max-width:none;flex:none}
.logo .lc{display:var(--logo-c)} .logo .lw{display:var(--logo-w)}
.theme{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-weight:500;transition:border-color .3s ease}

.hero{display:flex;flex-direction:column;gap:28px}

.name{margin:0;font-weight:700;font-size:clamp(46px, 12.5cqi, 136px);line-height:.95;letter-spacing:-.04em;text-wrap:balance;text-align:center}

/* video */
.video{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--deep)}
.video.is-vertical{aspect-ratio:9/16;width:min(100%, 440px);margin:0 auto}
.video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--deep)}
.video.is-playing video{object-fit:contain}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px, 2cqi, 18px);color:var(--on-deep);cursor:pointer;text-align:center;padding:16px;
  background:radial-gradient(70% 60% at 50% 115%, rgba(226,169,44,.55), rgba(226,169,44,0) 70%),linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.45))}

.video iframe.disk.loaded{opacity:1}

/* galerie */
.gallery{display:flex;flex-direction:column;gap:20px;padding:24px;border-radius:var(--r);border:1px solid var(--line);
  background:radial-gradient(90% 160% at 100% 100%, var(--glow), transparent 60%),var(--surface)}

.about-body{display:flex;flex-direction:column;gap:18px;min-width:0}

.mini-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}

/* odkazy */
.links{display:flex;flex-direction:column;gap:28px}

function t(k,tag,cls,acc){ var v=S[k]; var inner = editing ? esc(v) : (acc?accent(v):esc(v)); return '<'+tag+(cls?' class="'+cls+'"':'')+' data-k="'+k+'"'+(editing?' contenteditable="true" spellcheck="true"':'')+'>'+inner+'</'+tag+'>'; }
function linkLine(k, url){
  var v=S[k]||''; if(!editing && !v.trim()) return '';
  var inner = editing ? esc(v) : esc(v).replace(/\[([^\]]+)\]/, function(_,w){ return '<a href="'+esc(url)+'"'+ext(url)+'>'+w+'</a>'; });
  return '<p class="film-line" data-k="'+k+'"'+(editing?' contenteditable="true" spellcheck="true"':'')+'>'+inner+'</p>';
}
function ext(url){ return (/^https?:/i.test(url) || /\.pdf($|[?#])/i.test(url)) ? ' target="_blank" rel="noopener"' : ''; }
function telHref(p){ return 'tel:'+String(p||'').replace(/[^\d+]/g,''); }

function pageHTML(){
  var facts = S.facts.map(function(f,i){
    if(!editing && !(f.k||'').trim() && !(f.v||'').trim()) return '';
    var ce = editing?' contenteditable="true"':'';
    return '<div class="fact"><dt><span data-f="'+i+'.k"'+ce+'>'+esc(f.k)+'</span>'+(editing?'<button class="fx" type="button" data-del="'+i+'" aria-label="Smazat položku">×</button>':'')+'</dt><dd data-f="'+i+'.v"'+ce+'>'+esc(f.v)+'</dd></div>';
  }).join('');
  var poster = S.videoPoster || A.poster || '';
  var vClass = 'video'+(S.videoFormat==='9:16'?' is-vertical':'')+(poster?' has-poster':'')+(playing?' is-playing':'');
  var note = vidMissing ? '<span class="vnote">Video brzy doplním</span>' : '';
  return ''+
  '<header class="wrap top">'+
    '<a class="logo" href="'+esc(S.webUrl)+'"'+ext(S.webUrl)+' aria-label="OD Videos"><img class="lc" src="'+A.color+'" alt="OD Videos"><img class="lw" src="'+A.white+'" alt="OD Videos"></a>'+
    '<button class="theme" id="themeBtn" type="button"></button>'+
  '</header>'+
  '<main class="wrap">'+
    '<section class="hero">'+
      t('name','h1','name rise')+
      '<div class="'+vClass+' rise d1" id="vbox">'+
        '<video id="vid" playsinline preload="metadata"'+(S.videoSrc?' src="'+esc(S.videoSrc)+'"':'')+(poster?' poster="'+esc(poster)+'"':'')+'></video>'+
        '<div class="cover" id="vcover" role="button" tabindex="0" aria-label="Přehrát video">'+
          '<span class="play">'+I.play+'</span>'+t('videoLabel','span','vlabel')+note+
        '</div>'+
      '</div>'+
      '<div class="gallery rise d2">'+
        '<div class="gtext">'+t('galleryTitle','h3','')+t('galleryText','p','')+'</div>'+
        '<a class="btn-gold" href="'+esc(S.galleryUrl)+'"'+ext(S.galleryUrl)+'>'+t('galleryBtn','span','')+I.right+'</a>'+
      '</div>'+
      linkLine('filmLine', S.filmUrl)+
    '</section>'+
    '<section class="about">'+
      t('aboutTitle','h2','h2',true)+
      '<div class="about-body">'+t('about1','p','')+t('about2','p','')+'</div>'+
    '</section>'+
    '<section class="mini" aria-label="Ve zkratce">'+
      '<div class="mini-head">'+t('miniTitle','span','mini-title')+'<a class="mini-link" href="'+esc(S.cvUrl)+'"'+ext(S.cvUrl)+'>'+t('miniLink','span','')+I.arrow+'</a></div>'+
      '<dl class="facts">'+facts+'</dl>'+
      (editing?'<button class="fadd" type="button" id="fadd">+ Přidat položku</button>':'')+
    '</section>'+
    gearHTML()+
    '<section class="links">'+
      t('linksTitle','h2','h2',true)+
      '<div class="cards">'+
        card(S.cvUrl, I.doc, 'cvTitle','cvText')+
        card(S.webUrl, I.globe, 'webTitle','webText')+
        card(S.igUrl, I.insta, 'igTitle','igText')+
      '</div>'+
      '<div class="contact">'+
        '<div class="crow"><div style="min-width:0">'+t('emailLabel','div','cl')+'<a class="cv" href="mailto:'+esc(S.email)+'">'+t('email','span','')+'</a></div><button class="copy" type="button" data-copy="email">'+I.copy+'<span>Kopírovat</span></button></div>'+
        '<div class="crow"><div style="min-width:0">'+t('phoneLabel','div','cl')+'<a class="cv" href="'+esc(telHref(S.phone))+'">'+t('phone','span','')+'</a></div><button class="copy" type="button" data-copy="phone">'+I.copy+'<span>Kopírovat</span></button></div>'+
      '</div>'+
    '</section>'+
  '</main>'+
  '<footer class="foot"><div class="wrap"><img src="'+A.white+'" alt="OD Videos">'+t('footer','span','')+'</div></footer>';
}
function gearHTML(){
  var items=(S.gear||[]).map(function(g,i){
    if(!editing && !(g.v||'').trim()) return '';
    var ce = editing?' contenteditable="true"':'';
    return '<div class="gear-item"><span class="gear-ic">'+(I[g.i]||I.camera)+'</span>'+
      '<span class="gear-k" data-g="'+i+'.k"'+ce+'>'+esc(g.k)+'</span>'+
      '<span class="gear-v" data-g="'+i+'.v"'+ce+'>'+esc(g.v)+'</span>'+
      (editing?'<button class="fx" type="button" data-gdel="'+i+'" aria-label="Smazat položku">×</button>':'')+'</div>';
  }).join('');
  if(!editing && !items) return '';
  return '<section class="gear" aria-label="Vybavení">'+
    '<div class="gear-head">'+t('gearTitle','h2','h2',true)+t('gearText','p','')+'</div>'+
    '<div class="gear-list">'+items+'</div>'+
    (editing?'<button class="fadd" type="button" id="gadd">+ Přidat vybavení</button>':'')+
  '</section>';
}
function card(url, icon, tk, sk){
  return '<a class="card" href="'+esc(url)+'"'+ext(url)+'><span class="ic">'+icon+'</span><span class="arr">'+I.arrow+'</span>'+t(tk,'span','ct')+t(sk,'span','cs')+'</a>';
}

function render(){
  var y = device==='mobile' ? ($('#frame')||{}).scrollTop : window.scrollY;
  $('#page').innerHTML = pageHTML();
  paintTheme(); bindVideo();
  if(device==='mobile' && $('#frame')) $('#frame').scrollTop = y||0;
}

/* ---------- video ---------- */
function driveId(x){ x=String(x||'').trim(); if(!x) return ''; var m=x.match(/\/d\/([\w-]{20,})/)||x.match(/[?&]id=([\w-]{20,})/); return m?m[1]:(/^[\w-]{20,}$/.test(x)?x:''); }
var MIN_W=540;
function fitFrame(box, f){
  var w=box.clientWidth, h=box.clientHeight; if(!w||!h) return;
  if(w>=MIN_W){ f.style.cssText='width:100%;height:100%'; return; }
  f.style.cssText='width:'+MIN_W+'px;height:'+Math.round(MIN_W*h/w)+'px;transform:scale('+(w/MIN_W)+');transform-origin:top left';
}
function mountDrive(box, id){
  if(box.querySelector('iframe')) return;
  var f=document.createElement('iframe'); f.className='disk';
  f.src='https://drive.google.com/file/d/'+id+'/preview'; f.allow='autoplay; fullscreen'; f.allowFullscreen=true; f.title='Video';
  fitFrame(box,f);
  try{ new ResizeObserver(function(){ fitFrame(box,f); }).observe(box); }catch(e){}
  f.addEventListener('load', function(){ f.classList.add('loaded'); });
  box.appendChild(f);
}
function bindVideo(){
  var v=$('#vid'), c=$('#vcover'), box=$('#vbox'); if(!v) return;
  var did = S.preview ? '' : driveId(S.videoDrive);
  if(did && !editing){
    v.removeAttribute('src');
    try{
      var io=new IntersectionObserver(function(es,o){ es.forEach(function(e){ if(e.isIntersecting){ o.disconnect(); mountDrive(box,did); } }); },{rootMargin:'300px'});
      io.observe(box);
    }catch(e){ mountDrive(box,did); }
    return;
  }
  if(!S.videoSrc){ markMissing(); }
  v.addEventListener('error', markMissing);
  v.addEventListener('ended', function(){ playing=false; box.classList.remove('is-playing'); v.controls=false; });
  function go(){
    if(editing || vidMissing) return;
    var p=v.play(); playing=true; box.classList.add('is-playing'); v.controls=true;
    if(p && p.catch) p.catch(function(){ playing=false; box.classList.remove('is-playing'); v.controls=false; });
  }
  c.addEventListener('click', go);
  c.addEventListener('keydown', function(e){ if(e.target!==c) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
}
function markMissing(){
  if(vidMissing) return; vidMissing=true;
  var c=$('#vcover'); if(c && !c.querySelector('.vnote')){ var s=document.createElement('span'); s.className='vnote'; s.textContent='Video brzy doplním'; c.appendChild(s); }
}

/* ---------- kopírování ---------- */
function copy(btn){
  var k=btn.getAttribute('data-copy'), val=S[k]; var lbl=btn.querySelector('span');
  function done(ok){ lbl.textContent = ok?'Zkopírováno':'Označeno'; setTimeout(function(){ lbl.textContent='Kopírovat'; },1600); }
  function sel(){ var el=$('[data-k="'+k+'"]'); if(el){ var r=document.createRange(); r.selectNodeContents(el); var s=getSelection(); s.removeAllRanges(); s.addRange(r); } done(false); }
  try{ navigator.clipboard.writeText(val).then(function(){done(true)}, sel); }catch(e){ sel(); }
}

/* ---------- úpravy ---------- */
function collect(){
  $$('#page [data-k]').forEach(function(el){ S[el.getAttribute('data-k')] = el.innerText.replace(/ /g,' ').replace(/\n{3,}/g,'\n\n').trim(); });
  $$('#page [data-g]').forEach(function(el){ var p=el.getAttribute('data-g').split('.'); S.gear[+p[0]][p[1]] = el.innerText.replace(/\u00a0/g,' ').trim(); });
  $$('#page [data-f]').forEach(function(el){ var p=el.getAttribute('data-f').split('.'); S.facts[+p[0]][p[1]] = el.innerText.replace(/ /g,' ').trim(); });
}
function setEditing(on){
  if(!S.preview) return;
  if(editing===on) return;
  if(editing) collect();
  editing=on; playing=false;
  document.body.classList.toggle('editing', on);
  $('#epanel').hidden = !on;
  var b=$('#bedit'); b.classList.toggle('gold', on); b.innerHTML = I.pen+'<span class="lbl">'+(on?'Hotovo':'Upravit')+'</span> <kbd>E</kbd>';
  if(on) fillPanel();
  render();
}
var FIELDS = [
  ['videoDrive','Video na webu z Google Disku (odkaz)','text'],
  ['videoSrc','Video jako soubor (.mp4)','text'],
  ['videoPoster','Náhled videa (obrázek, nepovinné)','text'],
  ['videoFormat','Formát videa','select'],
  ['galleryUrl','Odkaz na galerii','url'],
  ['filmUrl','Odkaz na film (YouTube)','url'],
  ['cvUrl','Odkaz na CV v PDF','text'],
  ['webUrl','Odkaz na web','url'],
  ['igUrl','Odkaz na Instagram','url']
];
function fillPanel(){
  var h = FIELDS.map(function(f){
    var id='f-'+f[0];
    if(f[2]==='select') return '<div class="field"><label for="'+id+'">'+f[1]+'</label><select id="'+id+'" data-field="'+f[0]+'"><option value="16:9"'+(S.videoFormat!=='9:16'?' selected':'')+'>Na šířku 16:9</option><option value="9:16"'+(S.videoFormat==='9:16'?' selected':'')+'>Na výšku 9:16</option></select></div>';
    return '<div class="field"><label for="'+id+'">'+f[1]+'</label><input id="'+id+'" type="'+(f[2]==='url'?'url':'text')+'" data-field="'+f[0]+'" value="'+esc(S[f[0]])+'" spellcheck="false"></div>';
  }).join('');
  $('#efields').innerHTML = h;
}
function buildDoc(web){
  var data = JSON.parse(JSON.stringify(S)); data.preview = !web;
  var J=function(o){ return JSON.stringify(o).replace(/</g,'\\u003c'); };
  var SC='<'+'/script>';
  var css=$('#css').textContent, js=$('#main').textContent;
  var title='<title>'+esc(S.name)+'</title>';
  var fonts='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="'+FONT_URL+'">';
  var scripts='<script type="application/json" id="page-data">'+J(data)+SC+'<script type="application/json" id="assets">'+J(A)+SC+'<script id="main">'+js+SC;
  if(web){
    return '<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+title+'<meta name="description" content="'+esc(S.name+' – videotvůrce, OD Videos. Přihláška do Akademie mladých tvůrců.')+'">'+fonts+'<style>'+RESET+'</style><style id="css">'+css+'</style></head><body><div id="app"></div>'+scripts+'</body></html>';
  }
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+title+'<meta name="claude:viewport-fit-sides" content="cover">'+fonts+'<style id="css">'+css+'</style><div id="app"></div>'+scripts+'</body></html>';
}
function status(msg){ var s=$('#estatus'); if(s) s.textContent=msg; }
var artifactNS=null, downloadsNS=null;
function save(){
  collect();
  if(!artifactNS){ status('Ukládání tady nejde. Použij Stáhnout HTML.'); return; }
  var b=$('#esave'); b.disabled=true; status('Ukládám…');
  artifactNS.publish(buildDoc(false)).then(function(){ status('Uloženo.'); b.disabled=false; }, function(e){
    b.disabled=false;
    var c=e&&e.code; status(c==='conflict'?'Mezitím vznikla novější verze. Stránka se načte znovu.':(c==='not_granted'||c==='not_writer')?'Nemáš oprávnění ukládat. Stáhni HTML.':'Uložení se nepovedlo. Zkus to znovu.');
  });
}
function download(){
  collect();
  if(!downloadsNS){ status('Stahování tady nejde.'); return; }
  status('Připravuji soubor…');
  downloadsNS.save({filename:'odm.html', data:buildDoc(true)}).then(function(){ status('Soubor odm.html je stažený.'); }, function(e){
    var c=e&&e.code; status(c==='declined'?'Stahování zrušeno.':c==='rate_limited'?'Chvíli počkej a zkus to znovu.':'Stažení se nepovedlo.');
  });
}

/* ---------- zařízení ---------- */
function setDevice(d){
  if(!S.preview) return;
  device=d; document.body.classList.toggle('dev-mobile', d==='mobile');
  $$('[data-dev]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-dev')===d); b.setAttribute('aria-pressed', b.getAttribute('data-dev')===d?'true':'false'); });
  try{ localStorage.setItem('odm-device', d) }catch(e){}
}

/* ---------- start ---------- */
function shell(){
  var app=$('#app');
  var h = '<div id="stage"'+(S.preview?'':' class="web"')+'><div id="frame"><div class="page" id="page"></div></div></div>';
  if(S.preview){
    h += '<div class="pbar" role="toolbar" aria-label="Náhled">'+
      '<button type="button" data-dev="desktop">'+I.desk+'<span class="lbl">Počítač</span></button>'+
      '<button type="button" data-dev="mobile">'+I.mob+'<span class="lbl">Mobil</span></button>'+
      '<span class="sep"></span>'+
      '<button type="button" id="bedit">'+I.pen+'<span class="lbl">Upravit</span> <kbd>E</kbd></button>'+
    '</div>'+
    '<aside class="epanel" id="epanel" hidden aria-label="Úpravy">'+
      '<h2>Úpravy</h2>'+
      '<p>Klikni do libovolného textu na stránce a přepiš ho. Slovo v hvězdičkách, třeba <code>*každého*</code>, bude ručně psané a zlaté. Slovo v <code>[hranatých závorkách]</code> je odkaz na film.</p>'+
      '<div id="efields" style="display:flex;flex-direction:column;gap:12px"></div>'+
      '<div class="eactions">'+
        '<button class="ebtn primary" type="button" id="esave">Uložit změny</button>'+
        '<button class="ebtn" type="button" id="edl">Stáhnout HTML pro web</button>'+
        '<button class="ebtn" type="button" id="edone">Hotovo</button>'+
      '</div>'+
      '<div class="estatus" id="estatus" role="status"></div>'+
    '</aside>';
  }
  app.innerHTML = h;
}
shell();
if(S.preview){ var dv='desktop'; try{ dv=localStorage.getItem('odm-device')||'desktop' }catch(e){} setDevice(dv==='mobile'?'mobile':'desktop'); }
render();

document.addEventListener('click', function(e){
  var el=e.target.closest ? e.target : e.target.parentElement;
  var a=el.closest('#page a'); if(a && editing){ e.preventDefault(); return; }
  var cp=el.closest('[data-copy]'); if(cp){ copy(cp); return; }
  if(el.closest('#themeBtn')){ toggleTheme(); return; }
  var dv=el.closest('[data-dev]'); if(dv){ setDevice(dv.getAttribute('data-dev')); return; }
  if(el.closest('#bedit')){ setEditing(!editing); return; }
  if(el.closest('#edone')){ setEditing(false); return; }
  if(el.closest('#esave')){ save(); return; }
  if(el.closest('#edl')){ download(); return; }
  var del=el.closest('[data-del]'); if(del){ collect(); S.facts.splice(+del.getAttribute('data-del'),1); render(); return; }
  var gd=el.closest('[data-gdel]'); if(gd){ collect(); S.gear.splice(+gd.getAttribute('data-gdel'),1); render(); return; }
  if(el.closest('#gadd')){ collect(); S.gear=S.gear||[]; S.gear.push({i:'camera',k:'Popisek',v:'Název'}); render(); return; }
  if(el.closest('#fadd')){ collect(); S.facts.push({k:'Popisek',v:'Hodnota'}); render(); return; }
});
document.addEventListener('input', function(e){
  var f=e.target.getAttribute && e.target.getAttribute('data-field'); if(!f) return;
  S[f]=e.target.value.trim();
  if(f==='videoSrc'||f==='videoPoster'||f==='videoFormat'||f==='videoDrive'){ vidMissing=false; collect(); render(); }
  else { collect(); render(); }
});
document.addEventListener('keydown', function(e){
  var tg=e.target, typing = tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName));
  if(typing){ if(e.key==='Escape') tg.blur(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var k=e.key.toLowerCase();
  if(k==='e' && S.preview){ e.preventDefault(); setEditing(!editing); }
  else if(k==='t'){ toggleTheme(); }
  else if(k==='m' && S.preview){ setDevice(device==='mobile'?'desktop':'mobile'); }
});
document.addEventListener('paste', function(e){
  var tg=e.target; if(!editing || !tg || !tg.closest || !tg.closest('[data-k],[data-f],[data-g]')) return;
  e.preventDefault(); var txt=(e.clipboardData||window.clipboardData).getData('text/plain'); document.execCommand('insertText', false, txt);
});

if(S.preview){
  use('artifact').then(function(ns){ artifactNS=ns; var b=$('#esave'); if(b && !ns){ b.hidden=true; } });
  use('downloads').then(function(ns){ downloadsNS=ns; var b=$('#edl'); if(b && !ns){ b.hidden=true; } });
}
})();
</script></body></html>
